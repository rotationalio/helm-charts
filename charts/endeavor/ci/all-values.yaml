global:
  origins:
    - http://quarterdeck.svc.cluster.local
    - http://endeavor.svc.cluster.local

  issuer: "http://quarterdeck.svc.cluster.local"

endeavor:
  origin: http://endeavor.svc.cluster.local
  auth:
    quarterdeckCSRFNamespace: quarterdeck
  csrf:
    disable: true
    namespace: endeavor-ci
    expectedOrigins: [https://endeavor-csrf.example.test]
    safeHTTPMethods: [GET, HEAD]
    allowMissingMetadata: true
    allowUnknownSite: true
    allowSiteNone: true
    allowedFetchModes: [cors]
    allowedFetchDestinations: [document]
    requireFetchMode: true
    requireFetchDestination: true

secrets:
  create: true

genoa:
  enabled: true

  genoa:
    adminDatabaseURL:
      secretName: admin-database-credentials

quarterdeck:
  enabled: true
  quarterdeck:
    csrf:
      namespace: quarterdeck-ci
      disable: true
      expectedOrigins: [https://quarterdeck-csrf.example.test]
      safeHTTPMethods: [GET, HEAD]
      allowMissingMetadata: true
      allowUnknownSite: true
      allowSiteNone: true
      allowedFetchModes: [cors]
      allowedFetchDestinations: [document]
      requireFetchMode: true
      requireFetchDestination: true
