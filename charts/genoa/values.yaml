# Default values for deploying Genoa jobs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: rotationalio/genoa
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

# Global variables are available to other charts as well.
global:
  # Specify a global log level for all microservices (can be overridden)
  # Verbosity of logging: trace, debug, info, warn, error, fatal, panic
  logging:
    level: info
    console: false

# Set the specific configuration for the Genoa job.
genoa:
  # Override global.logging
  logLevel: null
  consoleLog: null

  # Override the release name for Genoa (defaults to .genoa.fullname)
  release: ""

  # Specify the ordering for the Genoa Job (e.g. ArgoCD syncwave or Helm weight)
  # Should be greater than the ordering for the Genoa ConfigMap.
  ordering: -1

  # Specify the admin database URL secret for Genoa.
  adminDatabaseURL:
    secretName: ""
    secretKey: "databaseURL"

  # Specify the commands for Genoa.
  # See the Genoa documentation for more information on commands and arguments.
  commands: []

# Specify the configuration for the Genoa ConfigMap and the genoa.yaml file.
config:
  # Specify the filename for the Genoa config YAML.
  filename: "genoa.yaml"

  # Specify the mount path for the genoa.yaml file.
  mountPath: "/etc/genoa"

  # Specify the ordering for the Genoa ConfigMap (e.g. ArgoCD syncwave or Helm weight)
  ordering: -2

  # Specify a different version for the Genoa config YAML
  # Defaults to the chart's appVersion.
  version: ""

# Additional pod spec configuration
pod:
  annotations: {}
  labels: {}
  securityContext: {}

# Additional container spec configuration
containers:
  securityContext: {}

# Pod requested resources and limits.
resources: {}

# Node selector for the pods.
nodeSelector: {}

# Tolerations for the pods.
tolerations: []

# Affinity rules for the pods.
affinity: {}

# Configuration for service account, role, and role binding.
# Genoa requires access to secrets to manage the kubernetes cluster.
serviceAccount:
  # Specifies whether a service account should be created.
  create: true

  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

  # Automatically mount a ServiceAccount's API credentials?
  automount: true

  # Specify the ordering for the Genoa ServiceAccount (e.g. ArgoCD syncwave or Helm weight)
  ordering: -2
  annotations: {}

  # The role is created if the service account is created.
  role:
    # The name of the role to use.
    # If not set and create is true, a name is generated using the fullname template.
    name: ""

    # Specify the ordering for the Genoa Role (e.g. ArgoCD syncwave or Helm weight)
    ordering: -2
    annotations: {}

  # The role binding is created if the service account is created.
  roleBinding:
    # The name of the role binding to use.
    # If not set and create is true, a name is generated using the fullname template.
    name: ""

    # Specify the ordering for the Genoa Role Binding (e.g. ArgoCD syncwave or Helm weight)
    ordering: -2
    annotations: {}
