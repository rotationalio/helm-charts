{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "quarterdeck.secrets.jwks.name" . }}
  labels:
    {{- include "quarterdeck.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.quarterdeck.auth.jwks.keys }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- end -}}